<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Student - Student Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">


    <!-- Navbar -->

    <nav class="navbar navbar-dark bg-primary">

        <div class="container">

            <a class="navbar-brand" href="/">
                Student Management System
            </a>

            <a href="/students/" class="btn btn-light">
                View Students
            </a>

        </div>

    </nav>


    <!-- Main Content -->

    <div class="container mt-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-header bg-warning">

                        <h4 class="mb-0">
                            Edit Student
                        </h4>

                    </div>


                    <div class="card-body">

                        <form method="POST">

                            {% csrf_token %}


                            <!-- Student ID -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Student ID
                                </label>

                                <input
                                    type="text"
                                    name="student_id"
                                    class="form-control"
                                    value="{{ student.student_id }}"
                                    required
                                >

                            </div>


                            <!-- Name -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    name="name"
                                    class="form-control"
                                    value="{{ student.name }}"
                                    required
                                >

                            </div>


                            <!-- Email -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    name="email"
                                    class="form-control"
                                    value="{{ student.email }}"
                                    required
                                >

                            </div>


                            <!-- Phone -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Phone Number
                                </label>

                                <input
                                    type="text"
                                    name="phone"
                                    class="form-control"
                                    value="{{ student.phone }}"
                                    required
                                >

                            </div>


                            <!-- Course -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Course
                                </label>

                                <select
                                    name="course"
                                    class="form-select"
                                    required
                                >

                                    <option value="B.Tech"
                                        {% if student.course == "B.Tech" %}selected{% endif %}>
                                        B.Tech
                                    </option>

                                    <option value="BCA"
                                        {% if student.course == "BCA" %}selected{% endif %}>
                                        BCA
                                    </option>

                                    <option value="MCA"
                                        {% if student.course == "MCA" %}selected{% endif %}>
                                        MCA
                                    </option>

                                    <option value="BBA"
                                        {% if student.course == "BBA" %}selected{% endif %}>
                                        BBA
                                    </option>

                                    <option value="MBA"
                                        {% if student.course == "MBA" %}selected{% endif %}>
                                        MBA
                                    </option>

                                </select>

                            </div>


                            <!-- Semester -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Semester
                                </label>

                                <select
                                    name="semester"
                                    class="form-select"
                                    required
                                >

                                    <option value="1"
                                        {% if student.semester == 1 %}selected{% endif %}>
                                        1st Semester
                                    </option>

                                    <option value="2"
                                        {% if student.semester == 2 %}selected{% endif %}>
                                        2nd Semester
                                    </option>

                                    <option value="3"
                                        {% if student.semester == 3 %}selected{% endif %}>
                                        3rd Semester
                                    </option>

                                    <option value="4"
                                        {% if student.semester == 4 %}selected{% endif %}>
                                        4th Semester
                                    </option>

                                    <option value="5"
                                        {% if student.semester == 5 %}selected{% endif %}>
                                        5th Semester
                                    </option>

                                    <option value="6"
                                        {% if student.semester == 6 %}selected{% endif %}>
                                        6th Semester
                                    </option>

                                    <option value="7"
                                        {% if student.semester == 7 %}selected{% endif %}>
                                        7th Semester
                                    </option>

                                    <option value="8"
                                        {% if student.semester == 8 %}selected{% endif %}>
                                        8th Semester
                                    </option>

                                </select>

                            </div>


                            <!-- Date of Birth -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Date of Birth
                                </label>

                                <input
                                    type="date"
                                    name="date_of_birth"
                                    class="form-control"
                                    value="{{ student.date_of_birth|date:'Y-m-d' }}"
                                    required
                                >

                            </div>


                            <!-- Address -->

                            <div class="mb-3">

                                <label class="form-label">
                                    Address
                                </label>

                                <textarea
                                    name="address"
                                    class="form-control"
                                    rows="4"
                                    required
                                >{{ student.address }}</textarea>

                            </div>


                            <!-- Buttons -->

                            <div class="d-flex gap-2">

                                <button
                                    type="submit"
                                    class="btn btn-warning">

                                    Update Student

                                </button>


                                <a
                                    href="/students/"
                                    class="btn btn-secondary">

                                    Cancel

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
