<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Attendance</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>


<body class="bg-light">


<!-- Navbar -->

<nav class="navbar navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand"
           href="{% url 'dashboard' %}">

            Student Management System

        </a>


        <a href="{% url 'logout' %}"
           class="btn btn-danger">

            Logout

        </a>

    </div>

</nav>


<!-- Main Container -->

<div class="container mt-5">


    <div class="row justify-content-center">

        <div class="col-md-7">


            <div class="card shadow">


                <!-- Header -->

                <div class="card-header bg-warning">

                    <h4 class="mb-0">

                        Edit Attendance

                    </h4>

                </div>


                <!-- Body -->

                <div class="card-body">


                    <form method="POST">

                        {% csrf_token %}


                        <!-- Student -->

                        <div class="mb-3">

                            <label class="form-label">

                                Select Student

                            </label>


                            <select
                                name="student"
                                class="form-select"
                                required>

                                {% for student in students %}

                                <option
                                    value="{{ student.id }}"
                                    {% if student.id == attendance.student.id %}
                                        selected
                                    {% endif %}>

                                    {{ student.student_id }} -
                                    {{ student.name }}

                                </option>

                                {% endfor %}

                            </select>

                        </div>


                        <!-- Date -->

                        <div class="mb-3">

                            <label class="form-label">

                                Date

                            </label>


                            <input
                                type="date"
                                name="date"
                                class="form-control"
                                value="{{ attendance.date|date:'Y-m-d' }}"
                                required>

                        </div>


                        <!-- Status -->

                        <div class="mb-3">

                            <label class="form-label">

                                Status

                            </label>


                            <select
                                name="status"
                                class="form-select"
                                required>


                                <option
                                    value="Present"
                                    {% if attendance.status == "Present" %}
                                        selected
                                    {% endif %}>

                                    Present

                                </option>


                                <option
                                    value="Absent"
                                    {% if attendance.status == "Absent" %}
                                        selected
                                    {% endif %}>

                                    Absent

                                </option>


                            </select>

                        </div>


                        <!-- Buttons -->

                        <button
                            type="submit"
                            class="btn btn-success">

                            Update Attendance

                        </button>


                        <a
                            href="{% url 'attendance_list' %}"
                            class="btn btn-secondary">

                            Cancel

                        </a>


                    </form>


                </div>

            </div>


        </div>

    </div>


</div>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
